server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;

    # ============================================
    # Nén Gzip - Tăng tốc độ tải trang (Core Web Vitals)
    # ============================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/ld+json
        image/svg+xml
        font/woff2;

    # ============================================
    # SEO: Route các file quan trọng
    # ============================================
    
    # robots.txt - Đảm bảo công cụ tìm kiếm có thể truy cập
    location = /robots.txt {
        access_log off;
        log_not_found off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header Content-Type "text/plain; charset=UTF-8";
    }

    # sitemap.xml - Sơ đồ website cho công cụ tìm kiếm
    location = /sitemap.xml {
        access_log off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header Content-Type "application/xml; charset=UTF-8";
    }

    # favicon.ico - Tránh log 404 không cần thiết
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ============================================
    # Proxy backend media (Node)
    # ============================================
    location = /api/media-proxy {
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_pass http://media-proxy:8787;
    }

    # ============================================
    # Route frontend (SPA)
    # ============================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ============================================
    # File HTML chính - Không cache để đảm bảo luôn mới
    # ============================================
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header X-Robots-Tag "index, follow" always;
    }

    # Các file HTML khác (ví dụ seo-check.html)
    location ~* \.(html)$ {
        expires -1;
        add_header Cache-Control "no-cache" always;
    }

    # ============================================
    # Tài nguyên tĩnh - Cache dài hạn (tăng hiệu năng)
    # ============================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ============================================
    # Header bảo mật (tăng độ tin cậy SEO)
    # ============================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ============================================
    # Tối ưu hiệu năng (Core Web Vitals)
    # ============================================
    
    # Tối ưu kết nối
    keepalive_timeout 65;
    keepalive_requests 100;
    
    # Tối ưu bộ đệm
    client_max_body_size 10m;
    client_body_buffer_size 128k;
}